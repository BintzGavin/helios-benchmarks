[package]
name = "podcast-editor-bridge"
version = "1.0.1"
authors = ["Dmitriy Kovalenko <dmtr.kovalenko@outlook.com>"]
edition = "2018"

[lib]
crate-type = ["cdylib", "rlib"]
path = "./lib.rs"

[dependencies]
wasm-bindgen = "0.2.100"
fframes.workspace = true
fframes-editor-controller = { path = "../../../../fframes-editor-controller" }
podcast-example = { path = "../../", default-features = false }

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = [
'cfg(wasm_bindgen_unstable_test_coverage)',
] }
